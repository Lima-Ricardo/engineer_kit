<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><rect width="1440" height="900" fill="#12151c"/><rect width="235" height="900" fill="#1a1f2b"/><line x1="235" y1="0" x2="235" y2="900" stroke="#2a3040"/><text x="24" y="34" class="accent mark">⚙</text><text x="54" y="31" class="brand">engineer_kit</text><text x="54" y="49" class="tiny dim">LOCAL LAB</text><text x="24" y="110" class="small dim">Pipelines</text><rect x="0" y="128" width="235" height="42" fill="#202635"/><text x="24" y="153" class="small bold">Arquitetura &amp; docs</text><text x="24" y="195" class="small dim">Dados locais</text><text x="24" y="237" class="small dim">dbt</text><text x="280" y="54" class="title">Arquitetura do engineer_kit</text><text x="280" y="82" class="small dim">Os mesmos contratos funcionam localmente, em arquivos e em Lakehouse.</text><g transform="translate(280,120)"><g><rect class="node" width="175" height="88" rx="8"/><text x="15" y="27" class="bold">Source</text><text x="15" y="51" class="small mono accent">RestConnector</text><text x="15" y="72" class="tiny dim">HTTP · auth · pagination</text></g><text x="188" y="54" class="arrow">→</text><g transform="translate(220,0)"><rect class="node" width="190" height="88" rx="8"/><text x="15" y="27" class="bold">Extraction</text><text x="15" y="51" class="small mono accent">ExtractionSession</text><text x="15" y="72" class="tiny dim">streaming · 25k batches</text></g><text x="423" y="54" class="arrow">→</text><g transform="translate(455,0)"><rect class="node" width="180" height="88" rx="8"/><text x="15" y="27" class="bold">Incremental</text><text x="15" y="51" class="small mono accent">StateStore</text><text x="15" y="72" class="tiny dim">watermark · checkpoint</text></g><text x="648" y="54" class="arrow">→</text><g transform="translate(680,0)"><rect class="node" width="170" height="88" rx="8"/><text x="15" y="27" class="bold">Bronze</text><text x="15" y="51" class="small mono accent">Destination</text><text x="15" y="72" class="tiny dim">DuckDB · Parquet · Delta</text></g><text x="863" y="54" class="arrow">→</text><g transform="translate(895,0)"><rect class="card" width="170" height="88" rx="8"/><text x="15" y="27" class="bold">Transform</text><text x="15" y="51" class="small mono accent">opcional</text><text x="15" y="72" class="tiny dim">dbt · Spark · SQL</text></g></g><g transform="translate(280,255)"><rect class="card" width="540" height="150" rx="8"/><text x="24" y="34" class="bold">Connector</text><text x="24" y="66" class="small">Protocolo de origem independente de cloud.</text><text x="24" y="92" class="small dim">REST continua REST em Databricks, Fabric, AWS, GCP e Azure.</text><text x="24" y="124" class="small mono accent">extract_incremental() → ExtractionSession</text><g transform="translate(570,0)"><rect class="card" width="555" height="150" rx="8"/><text x="24" y="34" class="bold">ExtractionSession</text><text x="24" y="66" class="small">Single-pass e streaming-first.</text><text x="24" y="92" class="small dim">collect() é opt-in para materializar tudo em memória.</text><text x="24" y="124" class="small mono accent">for batch in run: ...</text></g></g><g transform="translate(280,435)"><rect class="card" width="540" height="145" rx="8"/><text x="24" y="34" class="bold">StateStore</text><text x="24" y="66" class="small">Checkpoint separado da Bronze.</text><text x="24" y="98" class="small mono accent">get_watermark / set_watermark</text><g transform="translate(570,0)"><rect class="card" width="555" height="145" rx="8"/><text x="24" y="34" class="bold">RunLogBackend</text><text x="24" y="66" class="small">Auditoria desacoplada do destino.</text><text x="24" y="98" class="small mono accent">record(RunLogEntry)</text></g></g><text x="280" y="625" class="small dim bold">DOIS MODOS OFICIAIS</text><rect x="280" y="647" width="540" height="125" rx="8" class="card"/><text x="305" y="682" class="bold">Managed mode</text><text x="305" y="720" class="small mono green">API → Pipeline → Destination → checkpoint</text><rect x="850" y="647" width="555" height="125" rx="8" class="card"/><text x="875" y="682" class="bold">Embedded mode</text><text x="875" y="720" class="small mono green">API → batches → seu Spark/Polars → commit()</text><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#e4e7ec}.brand,.bold{font-weight:700}.brand{font-size:16px}.mark{font-size:22px}.title{font-size:26px;font-weight:700}.small{font-size:12px}.tiny{font-size:10px}.dim{fill:#8b93a7}.accent{fill:#ff6b4a}.green{fill:#b8f0c8}.mono{font-family:Consolas,monospace}.arrow{font-size:24px;fill:#8b93a7}.node{fill:#1a1f2b;stroke:#a64e3c}.card{fill:#1a1f2b;stroke:#2a3040}</style></svg>