<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><rect width="1440" height="900" fill="#12151c"/><rect width="235" height="900" fill="#1a1f2b"/><line x1="235" y1="0" x2="235" y2="900" stroke="#2a3040"/><text x="24" y="34" class="accent mark">⚙</text><text x="54" y="31" class="brand">engineer_kit</text><text x="54" y="49" class="tiny dim">LOCAL LAB</text><text x="24" y="110" class="small">Pipelines</text><text x="24" y="152" class="small dim">Arquitetura &amp; docs</text><text x="24" y="194" class="small dim">Dados locais</text><text x="24" y="236" class="small dim">dbt</text><rect x="22" y="330" width="190" height="42" rx="8" fill="#ff6b4a"/><text x="72" y="356" class="small bold">+ Novo pipeline</text><text x="280" y="54" class="title">Novo pipeline</text><text x="280" y="82" class="small dim">API → extraction batches → checkpoint → Bronze → transformação opcional.</text><g transform="translate(280,115)"><rect class="node" width="150" height="66" rx="8"/><text x="14" y="26" class="bold">Source</text><text x="14" y="49" class="small accent mono">RestConnector</text><text x="164" y="42" class="arrow">→</text><g transform="translate(200,0)"><rect class="node" width="170" height="66" rx="8"/><text x="14" y="26" class="bold">Extraction</text><text x="14" y="49" class="small accent mono">25.000/batch</text></g><text x="384" y="42" class="arrow">→</text><g transform="translate(420,0)"><rect class="node" width="145" height="66" rx="8"/><text x="14" y="26" class="bold">State</text><text x="14" y="49" class="small accent mono">StateStore</text></g><text x="579" y="42" class="arrow">→</text><g transform="translate(615,0)"><rect class="node" width="155" height="66" rx="8"/><text x="14" y="26" class="bold">Destination</text><text x="14" y="49" class="small accent mono">Bronze</text></g></g><rect x="280" y="220" width="1125" height="260" rx="8" class="outline"/><rect x="300" y="211" width="170" height="22" fill="#12151c"/><text x="310" y="226" class="small accent bold">1. SOURCE / CONNECTOR</text><text x="310" y="267" class="tiny dim">NOME DO PIPELINE</text><rect x="310" y="280" width="1050" height="38" rx="7" class="input"/><text x="326" y="305" class="small">orders</text><text x="310" y="348" class="tiny dim">URL BASE</text><rect x="310" y="360" width="760" height="38" rx="7" class="input"/><text x="326" y="385" class="small">https://api.example.com/v1/orders</text><text x="1090" y="348" class="tiny dim">MÉTODO</text><rect x="1090" y="360" width="270" height="38" rx="7" class="input"/><text x="1106" y="385" class="small">GET</text><text x="310" y="428" class="tiny dim">EXTRACTION BATCH SIZE</text><rect x="310" y="440" width="1050" height="38" rx="7" class="input"/><text x="326" y="465" class="small">25000</text><rect x="280" y="515" width="1125" height="270" rx="8" class="outline"/><rect x="300" y="506" width="130" height="22" fill="#12151c"/><text x="310" y="521" class="small accent bold">PAGINAÇÃO</text><text x="310" y="565" class="tiny dim">ESTRATÉGIA</text><rect x="310" y="578" width="320" height="38" rx="7" class="input"/><text x="326" y="603" class="small">page</text><text x="660" y="565" class="tiny dim">PAGE SIZE DA API</text><rect x="660" y="578" width="300" height="38" rx="7" class="input"/><text x="676" y="603" class="small">1000</text><text x="990" y="565" class="tiny dim">WRITE BATCH</text><rect x="990" y="578" width="370" height="38" rx="7" class="input"/><text x="1006" y="603" class="small">5000</text><rect x="310" y="650" width="1050" height="72" rx="8" fill="#241b18" stroke="#6a382d"/><text x="330" y="678" class="small bold">Três controles independentes</text><text x="330" y="705" class="small dim">API page size 1.000 → extraction batch 25.000 → destination write batch 5.000</text><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#e4e7ec}.brand,.bold{font-weight:700}.brand{font-size:16px}.mark{font-size:22px}.title{font-size:26px;font-weight: