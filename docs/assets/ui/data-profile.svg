<rect x="280" y="112" width="1125" height="72" rx="8" fill="#211a1b" stroke="#6b342d"/><text x="300" y="140" class="small dim">O profiling é somente leitura: não grava dados na Bronze e não avança checkpoint.</text><text x="300" y="163" class="small dim">A <tspan font-weight="700">primary_key</tspan> configurada é reutilizada; uma <tspan font-weight="700">PK candidata</tspan> também pode ser testada sem persistir identidade.</text>
