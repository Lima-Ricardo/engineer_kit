<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
<rect width="1440" height="900" fill="#12151c"/><rect width="235" height="900" fill="#1a1f2b"/><line x1="235" x2="235" y2="900" stroke="#2a3040"/>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#e4e7ec}.dim{fill:#8b93a7}.accent{fill:#ff6b4a}.small{font-size:12px}.tiny{font-size:10px}.title{font-size:26px;font-weight:700}.h{font-size:14px;font-weight:700}.panel{fill:#1a1f2b;stroke:#2a3040}.input{fill:#202635;stroke:#2a3040}.mono{font-family:Consolas,monospace}</style>
<text x="22" y="35" class="accent" font-size="20">⚙</text><text x="49" y="31" class="h">engineer_kit</text><text x="49" y="48" class="tiny dim">LOCAL LAB</text><line x1="0" x2="235" y1="70" y2="70" stroke="#2a3040"/><rect x="0" y="86" width="235" height="42" fill="#202635"/><text x="22" y="112" class="small" font-weight="700">Pipelines</text><text x="22" y="154" class="small dim">Arquitetura &amp; docs</text><text x="22" y="196" class="small dim">Dados locais</text><text x="22" y="238" class="small dim">dbt</text><rect x="22" y="300" width="190" height="28" rx="14" fill="none" stroke="#2a3040"/><text x="82" y="318" class="tiny dim">RUNTIME LOCAL</text><rect x="22" y="344" width="190" height="42" rx="8" fill="#ff6b4a"/><text x="74" y="370" class="small" font-weight="700" fill="#fff">+ Novo pipeline</text>
<text x="280" y="54" class="title">Editar pipeline</text><text x="280" y="81" class="small dim">API → extraction batches → checkpoint → Bronze → transformação opcional.</text>
<g transform="translate(280 110)"><rect width="130" height="58" rx="8" class="panel" stroke="#b75543"/><text x="14" y="23" class="h">Source</text><text x="14" y="43" class="small mono accent">RestConnector</text><text x="143" y="35" class="dim" font-size="20">→</text><g transform="translate(175)"><rect width="145" height="58" rx="8" class="panel"/><text x="14" y="23" class="h">Extraction</text><text x="14" y="43" class="small mono accent">ExtractionSession</text></g><text x="333" y="35" class="dim" font-size="20">→</text><g transform="translate(365)"><rect width="130" height="58" rx="8" class="panel"/><text x="14" y="23" class="h">State</text><text x="14" y="43" class="small mono accent">StateStore</text></g><text x="508" y="35" class="dim" font-size="20">→</text><g transform="translate(540)"><rect width="140" height="58" rx="8" class="panel"/><text x="14" y="23" class="h">Destination</text><text x="14" y="43" class="small mono accent">Bronze</text></g><text x="693" y="35" class="dim" font-size="20">→</text><g transform="translate(725)"><rect width="130" height="58" rx="8" class="panel"/><text x="14" y="23" class="h">Transform</text><text x="14" y="43" class="small mono accent">opcional</text></g></g>
<rect x="280" y="195" width="1125" height="355" rx="8" fill="none" stroke="#2a3040"/><text x="300" y="222" class="small accent" font-weight="700">1. SOURCE / CONNECTOR</text><text x="300" y="247" class="tiny dim" font-weight="700">NOME DO PIPELINE</text><rect x="300" y="258" width="1085" height="34" rx="8" class="input"/><text x="315" y="280" class="small">customers</text>
<text x="300" y="320" class="tiny dim" font-weight="700">URL BASE</text><rect x="300" y="331" width="520" height="34" rx="8" class="input"/><text x="315" y="353" class="small">https://api.example.com/v1/customers</text><text x="845" y="320" class="tiny dim" font-weight="700">MÉTODO HTTP</text><rect x="845" y="331" width="540" height="34" rx="8" class="input"/><text x="860" y="353" class="small">GET</text>
<text x="300" y="394" class="tiny dim" font-weight="700">EXTRACTION BATCH SIZE</text><rect x="300" y="405" width="330" height="34" rx="8" class="input"/><text x="315" y="427" class="small">25000</text><text x="650" y="394" class="tiny dim" font-weight="700">PRIMARY KEY / IDENTIDADE</text><rect x="650" y="405" width="330" height="34" rx="8" class="input"/><text x="665" y="427" class="small">customer_id</text><text x="1000" y="394" class="tiny dim" font-weight="700">DEDUPLICAÇÃO POR PK</text><rect x="1000" y="405" width="385" height="34" rx="8" class="input"/><text x="1015" y="427" class="small">Ativa — manter primeira ocorrência</text>
<text x="300" y="457" class="tiny dim">Default: 25.000 registros.</text><text x="650" y="457" class="tiny dim">Identidade simples ou composta; pode existir com dedup desligado.</text><text x="1000" y="457" class="tiny dim">PK repetida → descarta o registro inteiro posterior.</text>
<rect x="300" y="480" width="1085" height="48" rx="8" fill="#211a1b" stroke="#6b342d"/><text x="320" y="510" class="small dim"><tspan font-weight="700">Recomendação:</tspan> use Data Profile para validar completude, missing/null e duplicatas da PK antes de ativar dedup.</text>
<rect x="280" y="575" width="1125" height="160" rx="8" fill="none" stroke="#2a3040"/><text x="300" y="603" class="small accent" font-weight="700">PAGINAÇÃO</text><text x="300" y="630" class="tiny dim" font-weight="700">ESTRATÉGIA</text><rect x="300" y="641" width="330" height="34" rx="8" class="input"/><text x="315" y="663" class="small">cursor</text><text x="650" y="630" class="tiny dim" font-weight="700">PARÂMETRO CURSOR</text><rect x="650" y="641" width="330" height="34" rx="8" class="input"/><text x="665" y="663" class="small">after</text><text x="1000" y="630" class="tiny dim" font-weight="700">CAMPO CURSOR NA RESPOSTA</text><rect x="1000" y="641" width="385" height="34" rx="8" class="input"/><text x="1015" y="663" class="small">meta.next_cursor</text>
</svg>