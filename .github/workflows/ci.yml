name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core-only:
    name: core import without optional backends
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install core only
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Verify optional backends do not leak into core
        run: |
          python - <<'PY'
          import importlib.util

          for package in ('duckdb', 'pyarrow', 'deltalake'):
              assert importlib.util.find_spec(package) is None, f'{package} leaked into core dependencies'

          import engineer_kit
          from engineer_kit import Destination, Pipeline, StateStore

          assert engineer_kit.__version__
          assert Destination is not None
          assert Pipeline is not None
          assert StateStore is not None

          expected = {
              'DuckDBLoader': 'engineer_kit[duckdb]',
              'ParquetDestination': 'engineer_kit[parquet]',
              'DeltaDestination': 'engineer_kit[delta]',
          }
          for attribute, install_hint in expected.items():
              try:
                  getattr(engineer_kit, attribute)
              except ModuleNotFoundError as exc:
                  assert install_hint in str(exc)
              else:
                  raise AssertionError(f'{attribute} should require its optional extra')
          PY

  test:
    name: pytest / py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install tested runtime without dbt resolver overhead
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,ui,parquet,delta]'

      - name: Run tests with coverage
        run: python -m pytest -q -m 'not stress' --cov=engineer_kit --cov-report=term-missing

  dbt-extra:
    name: dbt optional extra smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dbt extra once
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dbt]'

      - name: Verify dbt-duckdb command
        run: dbt --version

  stress:
    name: synthetic ingestion stress
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install storage adapters
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,duckdb,parquet,delta]'

      - name: Run synthetic stress suite
        run: python -m pytest -q -m stress tests/test_stress_ingestion.py

  quality:
    name: quality and security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,ui,parquet,delta]'

      - name: Ruff
        run: ruff check src tests

      - name: Bandit
        run: bandit -q -r src/engineer_kit -ll

      - name: Dependency audit
        run: pip-audit

  package:
    name: build package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
