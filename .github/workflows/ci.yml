name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core-only:
    name: core import without optional backends
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install core only
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip check
      - name: Verify optional backends do not leak into core
        run: |
          python - <<'PY'
          import importlib.util
          for package in ('duckdb', 'pyarrow', 'deltalake'):
              assert importlib.util.find_spec(package) is None, f'{package} leaked into core dependencies'
          import engineer_kit
          from engineer_kit import Destination, Pipeline, StateStore
          assert engineer_kit.__version__
          assert Destination is not None
          assert Pipeline is not None
          assert StateStore is not None
          expected = {
              'DuckDBLoader': 'engineer_kit[duckdb]',
              'ParquetDestination': 'engineer_kit[parquet]',
              'DeltaDestination': 'engineer_kit[delta]',
          }
          for attribute, install_hint in expected.items():
              try:
                  getattr(engineer_kit, attribute)
              except ModuleNotFoundError as exc:
                  assert install_hint in str(exc)
              else:
                  raise AssertionError(f'{attribute} should require its optional extra')
          PY

  windows-file-safety:
    name: Windows file state and audit safety
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install core test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip check
      - name: Exercise Windows locks and scheduler propagation
        run: python -m pytest -q tests/test_file_adapters.py tests/test_scheduler_reliability.py

  test:
    name: pytest / py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install tested runtime without dbt resolver overhead
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,ui,parquet,delta]'
          python -m pip check
      - name: Run tests with coverage
        id: pytest
        continue-on-error: true
        run: python -m pytest -q -m 'not stress' --cov=engineer_kit --cov-report=term-missing --junitxml=pytest-results.xml
      - name: Annotate pytest failures
        if: steps.pytest.outcome == 'failure'
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          root = ET.parse('pytest-results.xml').getroot()
          failures = []
          for case in root.iter('testcase'):
              problem = case.find('failure')
              if problem is None:
                  problem = case.find('error')
              if problem is None:
                  continue
              name = f"{case.get('classname', '')}::{case.get('name', '')}".strip(':')
              message = (problem.get('message') or problem.text or 'pytest failure').strip()
              first_line = message.splitlines()[0][:1500]
              file_name = case.get('file')
              line = case.get('line')
              location = ''
              if file_name:
                  location = f" file={file_name}"
                  if line and str(line).isdigit():
                      location += f",line={int(line) + 1}"
              print(f"::error{location} title=pytest::{name}: {first_line}")
              failures.append(name)
          if not failures:
              print('::error title=pytest::pytest failed; inspect the job output')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## Pytest failures\n\n')
              for name in failures:
                  summary.write(f'- `{name}`\n')
          PY
          exit 1

  dbt-extra:
    name: dbt optional extra smoke and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dbt extra and audit tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dbt]' 'pip-audit>=2.7'
          python -m pip check
      - name: Verify dbt-duckdb command
        run: dbt --version
      - name: Audit dbt dependency tree
        run: pip-audit

  stress:
    name: synthetic ingestion stress
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install storage adapters
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,duckdb,parquet,delta]'
          python -m pip check
      - name: Run synthetic stress suite
        run: python -m pytest -q -m stress tests/test_stress_ingestion.py

  quality:
    name: quality and security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,ui,parquet,delta]'
          python -m pip check
      - name: Ruff
        run: ruff check src tests
      - name: Bandit
        run: bandit -q -r src/engineer_kit -ll
      - name: Dependency audit
        run: pip-audit

  package:
    name: build package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

  docs:
    name: build bilingual documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[docs]'
          python -m pip check
      - name: Build Portuguese docs strictly
        run: mkdocs build --strict
      - name: Build English docs strictly
        run: mkdocs build --strict -f mkdocs.en.yml
