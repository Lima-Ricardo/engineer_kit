site_name: engineer_kit
site_description: Reliable, streaming-first REST API ingestion for analytical destinations
site_url: https://lima-ricardo.github.io/engineer_kit/en/
repo_url: https://github.com/Lima-Ricardo/engineer_kit
repo_name: Lima-Ricardo/engineer_kit
edit_uri: edit/main/docs/en/
docs_dir: docs/en
site_dir: site/en

nav:
  - Home: index.md
  - News: news.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Mental model: getting-started/mental-model.md
      - First pipeline: getting-started/first-pipeline.md
  - Guides:
      - Authentication & secrets: guides/authentication.md
      - Pagination: guides/pagination.md
      - Incremental & watermarks: guides/incremental.md
      - Streaming & batching: guides/streaming.md
      - Managed mode: guides/managed-mode.md
      - Embedded mode / Spark: guides/embedded-mode.md
      - Destinations: guides/destinations.md
      - AWS / GCP / Azure: guides/platforms.md
      - Local Lab / UI: guides/ui.md
      - dbt: guides/dbt.md
  - Architecture: architecture.md
  - Reference:
      - YAML: reference/configuration.md
      - Python API: reference/python-api.md
      - CLI: reference/cli.md
      - Security: reference/security.md
      - Troubleshooting: reference/troubleshooting.md
      - FAQ: reference/faq.md
      - Releasing (maintainer): reference/releasing.md

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.tabs.link
    - search.suggest
    - search.highlight
  palette:
    - scheme: slate
      primary: deep orange
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: deep orange
      accent: orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

extra:
  alternate:
    - name: Português
      link: /engineer_kit/
      lang: pt-BR
    - name: English
      link: /engineer_kit/en/
      lang: en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
