[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "engineer_kit"
version = "0.1.0"
description = "Biblioteca de ingestao de APIs: conectores -> DuckDB -> dbt"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Ricardo Alex De Lima" }]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "duckdb>=1.0.0",
    "dbt-duckdb>=1.8.0",
    "apscheduler>=3.10",
    "typer>=0.12",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "tqdm>=4.66",
]

[project.scripts]
engineer_kit = "engineer_kit.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/engineer_kit"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "responses>=0.25", "httpx>=0.27"]
ui = ["fastapi>=0.110", "uvicorn>=0.29", "jinja2>=3.1", "python-multipart>=0.0.9"]
