[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "engineer_kit"
version = "0.1.0"
description = "Reliable, streaming-first REST API ingestion for analytical destinations"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Ricardo Alex De Lima" }]
requires-python = ">=3.10"
keywords = [
    "data-engineering",
    "api-ingestion",
    "etl",
    "elt",
    "rest-api",
    "incremental",
    "duckdb",
    "parquet",
    "delta-lake",
    "databricks",
    "microsoft-fabric",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.31",
    "apscheduler>=3.10",
    "typer>=0.12",
    "pyyaml>=6.0",
    "loguru>=0.7",
]

[project.urls]
Homepage = "https://github.com/Lima-Ricardo/engineer_kit"
Documentation = "https://lima-ricardo.github.io/engineer_kit/"
Repository = "https://github.com/Lima-Ricardo/engineer_kit"
Issues = "https://github.com/Lima-Ricardo/engineer_kit/issues"
Changelog = "https://github.com/Lima-Ricardo/engineer_kit/blob/main/CHANGELOG.md"
Security = "https://github.com/Lima-Ricardo/engineer_kit/blob/main/SECURITY.md"

[project.scripts]
engineer_kit = "engineer_kit.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/engineer_kit"]

[project.optional-dependencies]
duckdb = [
    "duckdb>=1.0.0",
    "tqdm>=4.66",
]
parquet = [
    "pyarrow>=18.0.0",
]
delta = [
    "pyarrow>=18.0.0",
    "deltalake>=1.6.0",
]
platform = [
    "pyarrow>=18.0.0",
    "deltalake>=1.6.0",
]
dbt = [
    "duckdb>=1.0.0",
    "dbt-duckdb>=1.8.0",
]
ui = [
    "duckdb>=1.0.0",
    "tqdm>=4.66",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]
local = [
    "duckdb>=1.0.0",
    "tqdm>=4.66",
    "dbt-duckdb>=1.8.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]
all = [
    "duckdb>=1.0.0",
    "tqdm>=4.66",
    "dbt-duckdb>=1.8.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pyarrow>=18.0.0",
    "deltalake>=1.6.0",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.6,<10",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "responses>=0.25",
    "httpx>=0.27",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "bandit>=1.7.9",
    "pip-audit>=2.7",
    "build>=1.2",
    "twine>=5.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "stress: resource-intensive ingestion tests",
]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
