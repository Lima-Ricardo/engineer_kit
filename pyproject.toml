[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "engineer_kit"
version = "0.1.0"
description = "Reliable Python API ingestion for analytical destinations"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Ricardo Alex De Lima" }]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "apscheduler>=3.10",
    "typer>=0.12",
    "pyyaml>=6.0",
    "loguru>=0.7",
]

[project.scripts]
engineer_kit = "engineer_kit.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/engineer_kit"]

[project.optional-dependencies]
duckdb = [
    "duckdb>=1.0.0",
    "tqdm>=4.66",
]
dbt = [
    "duckdb>=1.0.0",
    "dbt-duckdb>=1.8.0",
]
ui = [
    "duckdb>=1.0.0",
    "tqdm>=4.66",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]
local = [
    "duckdb>=1.0.0",
    "tqdm>=4.66",
    "dbt-duckdb>=1.8.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "responses>=0.25",
    "httpx>=0.27",
    "ruff>=0.6",
    "bandit>=1.7.9",
    "pip-audit>=2.7",
    "build>=1.2",
    "twine>=5.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
